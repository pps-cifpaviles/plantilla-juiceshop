# Pipeline base de Juice Shop — Puesta en Producción Segura
#
# - CI: construye la imagen Docker en un runner de GitHub (PR y push).
# - Despliegue SOLO en desarrollo (pps-dev): Juice Shop es vulnerable a propósito.
#
# En B3 añadirás Gitleaks, CodeQL y Semgrep; en B4, SCA y Trivy; en B5, ZAP.

name: pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: juiceshop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Desplegar en desarrollo
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: [self-hosted, pps-dev]
    environment: desarrollo
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar
        run: bash deploy/deploy.sh pps-dev.aula.lan
        env:
          ALUMNO: ${{ vars.ALUMNO }}
